syntax = "proto3";

package bas_apg.telemetry;

message Detection {
    string class_name = 1;
    float confidence = 2;
    int32 track_id = 3;
    float bbox_cx = 4;
    float bbox_cy = 5;
    float bbox_w = 6;
    float bbox_h = 7;
}

message Interaction {
    string class_name = 1;
    string state = 2; // e.g. "FAR", "NEAR", "HELD"
    float distance_mm = 3;
}

message FSMState {
    string current_step_id = 1;
    string status = 2;
    string start_time = 3; // Kept as string for simplicity, or could use int64 epoch
    string recovery_text = 4;
}

message TelemetryFrame {
    double timestamp = 1;
    FSMState fsm_state = 2;
    repeated Detection detections = 3;
    repeated Interaction interactions = 4;
    int32 latency_ms = 5;
    int32 fps = 6;
}

message Transform3D {
    float x = 1;
    float y = 2;
    float z = 3;
    float pitch = 4;
    float yaw = 5;
    float roll = 6;
}

message KinematicFrame {
    double timestamp = 1;
    repeated Transform3D hand_joints = 2; 
    map<string, Transform3D> tools = 3;   
}

message TelemetryLog {
    string procedure_name = 1;
    repeated TelemetryFrame frames = 2;
    repeated KinematicFrame kinematic_stream = 3;
}
